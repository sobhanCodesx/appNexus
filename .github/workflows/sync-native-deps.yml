name: Sync Native Dependencies

on:
  push:
    branches:
      - native-premium-v1
      - premium-ui-v2
    paths:
      - package.json
      - .github/workflows/sync-native-deps.yml

permissions:
  contents: write

concurrency:
  group: native-dependency-lock-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile
        run: npm install
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi

          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(native): sync dependency lockfile"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            sleep 2
          done

          echo "Could not publish lockfile after retries."
          exit 1
